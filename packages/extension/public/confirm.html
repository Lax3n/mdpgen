<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MDP Gen</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="confirm">
  <div class="sheet">
    <div class="glyph">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="url(#touchid-grad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <defs>
          <linearGradient id="touchid-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff6482"/>
            <stop offset="1" stop-color="#ff2d55"/>
          </linearGradient>
        </defs>
        <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/>
      </svg>
    </div>
    <h1>Touch ID</h1>
    <p id="what"></p>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="buttons">
      <button type="button" class="btn primary" id="retry" hidden data-i18n="confirmRetry"></button>
      <button type="button" class="btn" id="without" hidden data-i18n="confirmWithout"></button>
      <button type="button" class="btn" id="cancel" data-i18n="confirmCancel"></button>
    </div>
  </div>
  <script type="module" src="confirm.js"></script>
</body>
</html>
