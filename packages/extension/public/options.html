<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MDP Gen</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="options">
  <header class="hero">
    <img class="appicon" src="icons/icon128.png" alt="">
    <h1>MDP Gen</h1>
    <p data-i18n="optionsIntro"></p>
  </header>

  <h2 data-i18n="optionsSectionPassword"></h2>
  <section class="group">
    <div class="row">
      <span class="text"><span class="label" data-i18n="popupLength"></span></span>
      <span class="control">
        <input type="range" id="length" min="4" max="128" step="1" class="wide-range">
        <input type="number" id="lengthNumber" class="num" min="4" max="128" step="1">
      </span>
    </div>
    <label class="row"><span class="text"><span class="label" data-i18n="optUpper"></span></span><input type="checkbox" class="switch" id="upper"></label>
    <label class="row"><span class="text"><span class="label" data-i18n="optLower"></span></span><input type="checkbox" class="switch" id="lower"></label>
    <label class="row"><span class="text"><span class="label" data-i18n="optDigits"></span></span><input type="checkbox" class="switch" id="digits"></label>
    <label class="row"><span class="text"><span class="label" data-i18n="optSymbols"></span></span><input type="checkbox" class="switch" id="symbols"></label>
    <div class="row">
      <span class="text"><span class="label" data-i18n="optSymbolSet"></span><span class="help" data-i18n="optSymbolSetHelp"></span></span>
      <span class="control"><input type="text" id="symbolSet" class="wide" spellcheck="false" autocomplete="off"></span>
    </div>
    <label class="row"><span class="text"><span class="label" data-i18n="optRequireEach"></span><span class="help" data-i18n="optRequireEachHelp"></span></span><input type="checkbox" class="switch" id="requireEach"></label>
    <label class="row"><span class="text"><span class="label" data-i18n="optExcludeAmbiguous"></span><span class="help" data-i18n="optExcludeAmbiguousHelp"></span></span><input type="checkbox" class="switch" id="excludeAmbiguous"></label>
    <div class="row">
      <span class="text"><span class="label" data-i18n="optMaxConsecutive"></span><span class="help" data-i18n="optMaxConsecutiveHelp"></span></span>
      <span class="control"><input type="number" id="maxConsecutive" class="num" min="0" max="16" step="1"></span>
    </div>
    <div class="row"><span class="text"><span class="help mono" id="preview"></span></span></div>
  </section>

  <h2 data-i18n="optionsSectionBehaviour"></h2>
  <section class="group">
    <label class="row"><span class="text"><span class="label" data-i18n="optAutoSuggest"></span><span class="help" data-i18n="optAutoSuggestHelp"></span></span><input type="checkbox" class="switch" id="autoSuggest"></label>
    <label class="row"><span class="text"><span class="label" data-i18n="optShowOnAll"></span><span class="help" data-i18n="optShowOnAllHelp"></span></span><input type="checkbox" class="switch" id="showOnAllPasswordFields"></label>
    <label class="row"><span class="text"><span class="label" data-i18n="optSubmitAfterFill"></span><span class="help" data-i18n="optSubmitAfterFillHelp"></span></span><input type="checkbox" class="switch" id="submitAfterFill"></label>
    <div class="row">
      <span class="text"><span class="label" data-i18n="optRetain"></span><span class="help" data-i18n="optRetainHelp"></span></span>
      <span class="control"><input type="number" id="retainMinutes" class="num" min="0" max="1440" step="1"></span>
    </div>
  </section>

  <h2 data-i18n="optionsSectionTouchId"></h2>
  <section class="group">
    <label class="row"><span class="text"><span class="label" data-i18n="optTouchId"></span><span class="help" data-i18n="optTouchIdHelp"></span></span><input type="checkbox" class="switch" id="touchId"></label>
    <label class="row"><span class="text"><span class="label" data-i18n="optAutoTouchId"></span><span class="help" data-i18n="optAutoTouchIdHelp"></span></span><input type="checkbox" class="switch" id="autoTouchId"></label>
    <div class="row">
      <span class="text"><span class="label" id="touchIdStatus"></span><span class="help status" id="touchIdResult" aria-live="polite"></span></span>
      <span class="control">
        <button type="button" class="btn" id="touchIdEnroll" data-i18n="optTouchIdEnroll"></button>
        <button type="button" class="btn" id="touchIdTest" data-i18n="optTouchIdTest"></button>
        <button type="button" class="btn danger" id="touchIdReset" data-i18n="optTouchIdReset"></button>
      </span>
    </div>
  </section>

  <h2 data-i18n="vaultTitle"></h2>
  <section class="group" id="vaultNone" hidden>
    <div class="row">
      <span class="text"><span class="label" data-i18n="vaultIntro"></span><span class="help" data-i18n="vaultIntroHelp"></span></span>
      <span class="control"><button type="button" class="btn primary" id="vaultCreate" data-i18n="vaultCreate"></button></span>
    </div>
    <div class="row" id="vaultCreateStatusRow" hidden><span class="text"><span class="help status" id="vaultCreateStatus" aria-live="polite"></span></span></div>
  </section>
  <section class="group" id="vaultRecovery" hidden>
    <div class="row stack">
      <span class="label strong" data-i18n="vaultRecoveryTitle"></span>
      <span class="help" data-i18n="vaultRecoveryHelp"></span>
      <code class="recovery-key selectable" id="vaultRecoveryKey"></code>
      <div class="links"><button type="button" class="btn" id="vaultRecoveryCopy" data-i18n="popupCopy"></button></div>
      <label class="ack"><input type="checkbox" class="switch" id="vaultRecoveryAck"><span data-i18n="vaultRecoveryAck"></span></label>
      <div class="links"><button type="button" class="btn primary" id="vaultRecoveryDone" disabled data-i18n="vaultRecoveryDone"></button></div>
    </div>
  </section>
  <section class="group" id="vaultExists" hidden>
    <div class="row">
      <span class="text"><span class="label" id="vaultStatus"></span><span class="help" id="vaultCreatedAt"></span></span>
      <span class="control">
        <button type="button" class="btn primary" id="vaultUnlockNow" data-i18n="vaultUnlock" hidden></button>
        <button type="button" class="btn" id="vaultLockNow" data-i18n="vaultLock"></button>
      </span>
    </div>
    <div class="row">
      <span class="text"><span class="label" data-i18n="vaultLockMinutes"></span><span class="help" data-i18n="vaultLockMinutesHelp"></span></span>
      <span class="control"><input type="number" id="vaultLockMinutes" class="num" min="1" max="1440" step="1"></span>
    </div>
    <div class="row stack" id="vaultRecoveryUnlockRow">
      <span class="label" data-i18n="vaultRecoveryUnlock"></span>
      <span class="help" data-i18n="vaultRecoveryUnlockHelp"></span>
      <div class="links">
        <input type="text" id="vaultRecoveryInput" class="wide" data-i18n-placeholder="vaultRecoveryPlaceholder" autocomplete="off" spellcheck="false">
        <button type="button" class="btn" id="vaultRecoveryUnlockBtn" data-i18n="vaultUnlock"></button>
      </div>
      <span class="help status" id="vaultRecoveryStatus" aria-live="polite"></span>
    </div>
    <div class="row" id="vaultRelinkRow" hidden>
      <span class="text"><span class="label" data-i18n="vaultRelink"></span><span class="help" data-i18n="vaultRelinkHelp"></span></span>
      <span class="control"><button type="button" class="btn primary" id="vaultRelink" data-i18n="vaultRelink"></button></span>
    </div>
    <div class="row">
      <span class="text"><span class="label" data-i18n="vaultDestroy"></span><span class="help" data-i18n="vaultDestroyHelp"></span></span>
      <span class="control"><button type="button" class="btn danger" id="vaultDestroyBtn" data-i18n="vaultDestroy"></button></span>
    </div>
  </section>

  <h2 data-i18n="optionsSectionAbout"></h2>
  <section class="group">
    <div class="row"><span class="text"><span class="help" data-i18n="aboutPrivacy"></span></span></div>
    <div class="row"><span class="text"><span class="help" data-i18n="aboutRandom"></span></span></div>
    <div class="row">
      <span class="text"><span class="help"><a href="https://github.com/Lax3n/mdpgen" target="_blank" rel="noopener">GitHub</a> · <span id="version"></span></span></span>
      <span class="control"><button type="button" class="btn danger" id="reset" data-i18n="optionsReset"></button></span>
    </div>
  </section>
  <p class="status" id="saved" aria-live="polite"></p>
  <script type="module" src="options.js"></script>
</body>
</html>
