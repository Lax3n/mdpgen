<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MDP Gen</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header class="titlebar">
    <img class="appicon" src="icons/icon48.png" alt="">
    <h1>MDP Gen</h1>
    <span class="spacer"></span>
    <button type="button" class="icon" id="regenerate" data-i18n-title="bubbleAnother" data-i18n-aria="bubbleAnother"></button>
  </header>

  <div class="lozenge">
    <code id="password" class="masked" aria-live="polite"></code>
    <button type="button" class="icon" id="reveal" data-i18n-title="bubbleReveal" data-i18n-aria="bubbleReveal"></button>
  </div>
  <div class="meta"><span class="dot" id="dot"></span><span id="strength"></span>·<span id="bits"></span></div>

  <div class="actions">
    <button type="button" class="btn" id="copy" data-i18n="popupCopy"></button>
    <button type="button" class="btn" id="insert" data-i18n="popupInsert"></button>
    <button type="button" class="btn primary span" id="touchid" hidden></button>
  </div>
  <div class="status" id="status" aria-live="polite"></div>

  <section class="group mt8">
    <div class="row">
      <span class="label" data-i18n="popupLength"></span>
      <input type="range" id="length" min="8" max="64" step="1" aria-labelledby="lengthLabel">
      <output id="lengthValue" class="num"></output>
    </div>
    <label class="row"><span class="text"><span class="label" data-i18n="optUpper"></span></span><input type="checkbox" class="switch" id="upper"></label>
    <label class="row"><span class="text"><span class="label" data-i18n="optLower"></span></span><input type="checkbox" class="switch" id="lower"></label>
    <label class="row"><span class="text"><span class="label" data-i18n="optDigits"></span></span><input type="checkbox" class="switch" id="digits"></label>
    <label class="row"><span class="text"><span class="label" data-i18n="optSymbols"></span></span><input type="checkbox" class="switch" id="symbols"></label>
  </section>

  <section class="group mt12" id="last" hidden>
    <div class="row stack">
      <div class="text split">
        <span class="label strong" data-i18n="popupLast"></span>
        <span class="help" id="lastMeta"></span>
      </div>
      <div class="lozenge">
        <code id="lastValue" class="masked"></code>
        <button type="button" class="icon" id="lastReveal" data-i18n-title="bubbleReveal" data-i18n-aria="bubbleReveal"></button>
      </div>
      <div class="links">
        <button type="button" class="link-btn" id="lastCopy" data-i18n="popupCopy"></button>
        <button type="button" class="link-btn" id="lastForget" data-i18n="popupForget"></button>
      </div>
      <span class="help" data-i18n="popupLastHelp"></span>
    </div>
  </section>

  <footer>
    <a href="options.html" target="_blank" data-i18n="bubbleOptions"></a>
    <span id="version"></span>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
