<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Modifier le mot de passe</title></head>
<body>
  <form action="done.html" method="get">
    <label>Mot de passe actuel <input type="password" id="current" name="current" autocomplete="current-password"></label>
    <label>Nouveau mot de passe <input type="password" id="password" name="new" autocomplete="new-password"></label>
    <label>Confirmer <input type="password" id="confirm" name="confirm" autocomplete="new-password"></label>
    <button type="submit">Modifier</button>
  </form>
</body>
</html>
